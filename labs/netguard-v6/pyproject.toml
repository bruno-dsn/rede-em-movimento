[project]
name = "netguard-lab"
version = "6.0.0"
description = "NetGuard Empresas: piloto local de continuidade, recuperação verificável e fundamentos de segurança."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
