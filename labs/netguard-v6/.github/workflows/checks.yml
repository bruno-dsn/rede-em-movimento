name: Verificar laboratório

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test

  collector-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Coletar e validar no Windows real do CI
        shell: pwsh
        run: |
          $reports = Join-Path $env:RUNNER_TEMP 'netguard-checkup'
          python netguard_checkup.py --directory $reports --alias 'Windows CI'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $file = Get-ChildItem -LiteralPath $reports -Filter 'checkup-*.json' | Select-Object -First 1
          python netguard_checkup.py --validate $file.FullName
          $report = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
          if ($report.platform -ne 'Windows' -or $report.mode -ne 'observed' -or $report.checks.Count -ne 6) { throw 'Relatório incompleto.' }
          # Consulta sem permissão é válida, mas pelo menos uma fonte deve ser observada.
          if (@($report.checks | Where-Object status -ne 'unknown').Count -eq 0) { throw 'Nenhuma fonte Windows foi coletada.' }
          foreach ($script in @('Agendar-Checkup.ps1', 'Remover-Agendamento.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path 'scripts' $script), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) { throw 'Script de agendamento inválido.' }
          }

  operations-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_operations.py tests/test_business.py
      - name: Sintaxe e coleta real Windows, sem alterar firewall
        shell: pwsh
        run: .\scripts\Verificar-Operacoes-CI.ps1

  empresa-viva-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Testar portal, identidade e cenários em memória
        run: python -m unittest discover -s tests -p 'test_empresa_viva*.py' -v
